  <body>
    <script>
      // O GitHub Pages não conhece as rotas do React Router: o 404.html redirecciona
      // /JayJag07/imovel/jc-001 para /JayJag07/?/imovel/jc-001 e este bloco repõe o
      // endereço original antes de a aplicação arrancar.
      ;(function () {
        var q = window.location.search
        if (q.charAt(1) !== '/') return
        var decoded = q
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(
          null,
          null,
          window.location.pathname.replace(/\/$/, '') + decoded + window.location.hash,
        )
      })()
    </script>
